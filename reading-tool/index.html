<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Boswell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Capture's camera chrome intentionally stays outside the
              // theme system (parchment on black, regardless of theme).
              ink: '#0F0F0F',
              parchment: '#E8D5B0',
            },
            fontFamily: {
              display: ['"Instrument Serif"', 'serif'],
              serif: ['Newsreader', 'serif'],
              sans: ['"Hanken Grotesk"', 'system-ui', 'sans-serif'],
            },
            keyframes: {
              'badge-pop': {
                '0%': { transform: 'scale(0.4)', opacity: '0' },
                '35%': { transform: 'scale(1.4)', opacity: '1' },
                '55%': { transform: 'scale(0.85)' },
                '75%': { transform: 'scale(1.15)' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
            },
            animation: {
              // Re-triggered by remounting the badge with a fresh React key —
              // a plain CSS animation restarts on element creation, so it
              // replays every time there's something new to flash about.
              'badge-pop': 'badge-pop 600ms cubic-bezier(.22,.9,.4,1.1)',
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
