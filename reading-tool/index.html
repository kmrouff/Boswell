<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Boswell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Instrument Serif is only ever the "Boswell" wordmark -- display=optional
         means the browser gives it a very brief window to arrive from cache
         before first paint, and simply skips it (staying on the fallback
         serif) rather than swapping fonts visibly mid-render if it's slow. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=optional" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Capture's camera chrome intentionally stays outside the
              // theme system (parchment on black, regardless of theme).
              ink: '#0F0F0F',
              parchment: '#E8D5B0',
            },
            fontFamily: {
              display: ['"Instrument Serif"', 'serif'],
              serif: ['Newsreader', 'serif'],
              sans: ['"Hanken Grotesk"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
